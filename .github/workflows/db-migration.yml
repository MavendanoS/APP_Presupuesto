# Aplicar una migración a la base de producción (D1 gastos-db)
# Se lanza a mano: GitHub → Actions → DB migration → Run workflow → nombre del archivo.
#
# Antes de migrar se guarda un "bookmark" de D1 Time Travel en el log: con él se puede
# volver la base exactamente a ese momento (hasta 30 días atrás):
#   npx wrangler d1 time-travel restore gastos-db --bookmark=<bookmark>

name: DB migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Archivo en database/migrations (ej: 007-algo.sql)'
        required: true
        type: string
      confirm:
        description: 'Escribe APLICAR para confirmar'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Validar entrada
        env:
          MIGRATION: ${{ inputs.migration }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "APLICAR" ]; then
            echo "::error::Confirmación incorrecta. Escribe APLICAR."
            exit 1
          fi
          if ! [[ "$MIGRATION" =~ ^[0-9]{3}-[a-z0-9-]+\.sql$ ]]; then
            echo "::error::Nombre de archivo inválido: $MIGRATION"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar wrangler
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Bookmark de Time Travel (punto de restauración)
        working-directory: backend
        run: npx wrangler d1 time-travel info gastos-db

      - name: Aplicar migración
        working-directory: backend
        env:
          MIGRATION: ${{ inputs.migration }}
        run: |
          test -f "../database/migrations/$MIGRATION" || { echo "::error::No existe database/migrations/$MIGRATION"; exit 1; }
          npx wrangler d1 execute gastos-db --remote --yes --file="../database/migrations/$MIGRATION"
